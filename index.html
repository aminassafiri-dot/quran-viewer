<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Quran – Pages 1–604</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f1f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quran">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bar-h:48px;--bg:#2b2b2b;--bar:#1f1f1fee;--fg:#f2f2f2;--accent:#4aa3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:pan-y}

  /* Toolbar */
  #bar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--bar-h) + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
    display:flex;align-items:center;gap:6px;background:var(--bar);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .2s ease}
  #bar.hidden{transform:translateY(-100%)}
  #bar button{appearance:none;border:0;background:#ffffff1a;color:var(--fg);height:36px;min-width:40px;padding:0 10px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
  #bar button:active{background:#ffffff40}
  #bar button:disabled{opacity:.35}
  #pageBox{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
  #pageIn{width:58px;height:34px;border-radius:8px;border:1px solid #ffffff40;background:#00000040;color:var(--fg);font-size:16px;text-align:center}

  /* Menu panel */
  #panel{position:fixed;z-index:19;top:calc(var(--bar-h) + env(safe-area-inset-top));left:8px;right:8px;max-width:420px;margin:0 auto;
    background:#1f1f1f;border:1px solid #ffffff22;border-radius:12px;padding:14px;display:none;box-shadow:0 8px 30px #0008}
  #panel.open{display:block}
  #panel button{appearance:none;border:0;background:#ffffff1a;color:var(--fg);border-radius:8px;cursor:pointer;font-family:inherit}
  #panel button:active{background:#ffffff40}
  #panel h3{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.65}
  #panel input[type=range]{width:100%;margin:4px 0 14px}
  #panel .row{display:flex;gap:6px;margin-bottom:12px}
  #panel .row button{flex:1;height:38px;font-size:14px}
  #panel p{margin:0 0 8px;font-size:12px;opacity:.6;line-height:1.4}
  #panel .ver{margin:0;font-size:12px;opacity:.85;font-weight:600}

  /* Page area: vertical scroll only, no pinch/double-tap zoom, always fit width */
  #scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:calc(var(--bar-h) + env(safe-area-inset-top)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:pan-y}
  #stage{display:flex;justify-content:center;width:100%}
  .pg{position:relative;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #0003}
  .pg canvas{display:block}
  .pg.in-l{animation:inl .22s ease-out}
  .pg.in-r{animation:inr .22s ease-out}
  @keyframes inl{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inr{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}

  /* Selectable text layer (invisible text on top of canvas) */
  .textLayer{position:absolute;inset:0;overflow:clip;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;
    transform-origin:0 0;z-index:1;--scale-round-x:1px;--scale-round-y:1px}
  .textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
  .textLayer ::selection{background:#2a7fff55}
  .textLayer br::selection{background:transparent}
  .textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}

  /* Loading overlay */
  #loading{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:15px;text-align:center;padding:24px}
  #loading.done{display:none}
  .spin{width:34px;height:34px;border:3px solid #ffffff30;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #busy{position:fixed;z-index:15;top:calc(var(--bar-h) + env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:26px;height:26px;border:3px solid #00000030;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:none;background:#fff8}
  #busy.on{display:block}
</style>
</head>
<body>

<div id="bar">
  <button id="btnMenu" aria-label="Menu">☰</button>
  <button id="btnL" aria-label="Next page">›</button>
  <div id="pageBox"><input id="pageIn" type="number" inputmode="numeric" min="1" value="1" aria-label="Page number"><span id="pageTot">/ 604</span></div>
  <button id="btnR" aria-label="Previous page">‹</button>
</div>

<div id="panel">
  <h3>Go to page</h3>
  <input id="slider" type="range" min="1" max="604" value="1">
  <div class="row"><button id="btnFirst">First page</button></div>
  <p>Swipe right for the next page, swipe left for the previous page. Your last page and scroll position are saved automatically on this device. Works fully offline.</p>
  <p class="ver" id="verLbl"></p>
</div>

<div id="scroller"><div id="stage"><div class="pg" id="pg"></div></div></div>
<div id="busy"></div>

<div id="loading"><div class="spin"></div><div id="loadMsg">Loading viewer…</div></div>

<script src="pdf.min.js"></script>
<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);

  // Keep this the same as VERSION in sw.js every time you publish an update.
  const APP_VERSION = 'v3';
  $('verLbl').textContent = 'Version ' + APP_VERSION;

  const DOC_ID = 'quran_pages_1-604';
  const KEY = 'offlinePdfViewer:' + DOC_ID;
  const MAX_PIXELS = 15500000;          // stay under mobile canvas limit (~16.7M)
  const SWIPE_MIN = 60;                 // minimum swipe distance in px

  // ---------- state & persistence ----------
  // Zoom is fixed (always fit width) and swipe is always Arabic-book style (swipe right = next page).
  const st = { page: 1, sy: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (saved.page) st.page = saved.page;
    if (saved.sy != null) st.sy = saved.sy;
  } catch (e) {}
  const hm = /[#&]p=(\d+)/.exec(location.hash);
  if (hm) st.page = parseInt(hm[1], 10);
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
    try { history.replaceState(null, '', '#p=' + st.page); } catch (e) {}
  }

  // Block pinch-zoom and double-tap zoom everywhere
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  const setMsg = m => { $('loadMsg').textContent = m; };

  // ---------- load PDF engine and document ----------
  let pdfjsLib, pdf;
  try {
    setMsg('Preparing viewer…');
    pdfjsLib = globalThis.pdfjsLib;
    if (!pdfjsLib) throw new Error('PDF engine failed to load');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
    let worker = null;
    try { worker = new pdfjsLib.PDFWorker({ port: new Worker('pdf.worker.min.js') }); } catch (e) { console.warn('Worker unavailable, using fallback', e); }

    setMsg('Loading document… (first time only, about 6 MB)');
    const resp = await fetch('quran_pages_1-604.pdf');
    if (!resp.ok) throw new Error('Could not load the PDF (' + resp.status + ')');
    const params = { data: new Uint8Array(await resp.arrayBuffer()), isEvalSupported: false };
    if (worker) params.worker = worker;
    pdf = await pdfjsLib.getDocument(params).promise;
  } catch (err) {
    console.error(err);
    $('loading').innerHTML = '<div>Sorry, the viewer could not start.<br><small>' + (err && err.message || err) + '</small></div>';
    return;
  }

  const TOTAL = pdf.numPages;
  const clamp = n => Math.max(1, Math.min(TOTAL, n | 0));
  st.page = clamp(st.page || 1);
  $('pageTot').textContent = '/ ' + TOTAL;
  $('pageIn').max = TOTAL;
  $('slider').max = TOTAL;
  $('slider').style.direction = 'rtl';

  // ---------- rendering (always fit width) ----------
  const scroller = $('scroller'), pgEl = $('pg');
  let token = 0, curTask = null, suppressUntil = 0;

  async function show(n, opts) {
    opts = opts || {};
    n = clamp(n);
    const my = ++token;
    if (curTask) { try { curTask.cancel(); } catch (e) {} curTask = null; }
    $('busy').classList.add('on');
    try {
      const page = await pdf.getPage(n);
      if (my !== token) return;

      const base = page.getViewport({ scale: 1 });
      const cssW = Math.max(200, Math.floor(scroller.clientWidth));
      const scale = cssW / base.width;
      const vp = page.getViewport({ scale });

      let os = Math.min(window.devicePixelRatio || 1, 3);
      os = Math.max(0.5, Math.min(os, Math.sqrt(MAX_PIXELS / (vp.width * vp.height))));

      const cv = document.createElement('canvas');
      cv.width = Math.floor(vp.width * os);
      cv.height = Math.floor(vp.height * os);
      cv.style.width = Math.floor(vp.width) + 'px';
      cv.style.height = Math.floor(vp.height) + 'px';

      const task = page.render({
        canvas: cv,
        canvasContext: cv.getContext('2d'),
        viewport: vp,
        transform: os !== 1 ? [os, 0, 0, os, 0, 0] : null
      });
      curTask = task;
      await task.promise;
      if (my !== token) return;

      // text layer (selectable text)
      const tl = document.createElement('div');
      tl.className = 'textLayer';
      tl.style.setProperty('--scale-factor', scale);
      tl.style.setProperty('--total-scale-factor', scale);
      tl.style.width = Math.floor(vp.width) + 'px';
      tl.style.height = Math.floor(vp.height) + 'px';

      pgEl.className = 'pg';
      pgEl.replaceChildren(cv, tl);
      pgEl.style.width = Math.floor(vp.width) + 'px';
      pgEl.style.height = Math.floor(vp.height) + 'px';
      if (opts.from) { void pgEl.offsetWidth; pgEl.classList.add(opts.from < 0 ? 'in-l' : 'in-r'); }

      // scroll position (programmatic scrolls must not auto-hide the toolbar)
      suppressUntil = Date.now() + 400;
      $('bar').classList.remove('hidden');
      if (opts.keepFrac != null) scroller.scrollTop = opts.keepFrac * pgEl.offsetHeight;
      else if (opts.top) scroller.scrollTop = 0;

      st.page = n; updateUI(); save();
      curTask = null;
      $('busy').classList.remove('on');
      $('loading').classList.add('done');

      try {
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: page.streamTextContent(),
          container: tl,
          viewport: vp
        });
        await textLayer.render();
      } catch (e) { /* text layer is optional */ }
    } catch (err) {
      if (err && err.name === 'RenderingCancelledException') return;
      console.error(err);
      $('busy').classList.remove('on');
      $('loading').classList.add('done');
    }
  }

  // ---------- navigation (Arabic book style) ----------
  // Right swipe / left button = next page. Left swipe / right button = previous page.
  function go(n, from) {
    n = clamp(n);
    if (n === st.page) return;
    show(n, { from: from || 0, top: true });
    $('bar').classList.remove('hidden');
  }
  const nextPage = sign => go(st.page + 1, sign);
  const prevPage = sign => go(st.page - 1, sign);

  function updateUI() {
    $('pageIn').value = st.page;
    $('slider').value = st.page;
    $('btnL').disabled = st.page >= TOTAL;   // left button = next page
    $('btnR').disabled = st.page <= 1;       // right button = previous page
    document.title = 'Page ' + st.page + ' / ' + TOTAL;
  }

  $('btnL').onclick = () => nextPage(-1);
  $('btnR').onclick = () => prevPage(1);
  $('pageIn').addEventListener('change', e => { go(parseInt(e.target.value, 10) || st.page, 0); e.target.blur(); });
  $('pageIn').addEventListener('focus', e => e.target.select());
  $('slider').addEventListener('change', e => go(parseInt(e.target.value, 10), 0));
  $('slider').addEventListener('input', e => { $('pageIn').value = e.target.value; });
  $('btnFirst').onclick = () => { go(1, 0); $('panel').classList.remove('open'); };
  $('btnMenu').onclick = () => $('panel').classList.toggle('open');
  scroller.addEventListener('pointerdown', () => $('panel').classList.remove('open'));

  // ---------- swipe ----------
  let t0 = null;
  scroller.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { t0 = null; return; }
    const t = e.touches[0];
    t0 = { x: t.clientX, y: t.clientY, time: Date.now() };
  }, { passive: true });
  scroller.addEventListener('touchcancel', () => { t0 = null; }, { passive: true });
  scroller.addEventListener('touchend', e => {
    if (!t0) return;
    const s = t0; t0 = null;
    if (e.touches.length) return;
    const sel = window.getSelection && String(window.getSelection());
    if (sel) return;                                         // user is selecting text
    const t = e.changedTouches[0];
    const dx = t.clientX - s.x, dy = t.clientY - s.y, dt = Date.now() - s.time;
    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5 || dt > 900) return;
    dx > 0 ? nextPage(1) : prevPage(-1);                     // swipe right = next page
  }, { passive: true });

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') nextPage(-1);
    else if (e.key === 'ArrowRight') prevPage(1);
    else if (e.key === 'Home' && e.ctrlKey) go(1, 0);
    else if (e.key === 'End' && e.ctrlKey) go(TOTAL, 0);
  });

  // ---------- auto-hide toolbar & remember scroll ----------
  let lastTop = 0, saveT = null;
  scroller.addEventListener('scroll', () => {
    const y = scroller.scrollTop;
    if (Date.now() < suppressUntil) { lastTop = y; return; }
    if (y < 8 || y < lastTop - 8) $('bar').classList.remove('hidden');
    else if (y > lastTop + 12) { $('bar').classList.add('hidden'); $('panel').classList.remove('open'); }
    lastTop = y;
    clearTimeout(saveT);
    saveT = setTimeout(() => { st.sy = y / Math.max(1, pgEl.offsetHeight); save(); }, 400);
  }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { st.sy = scroller.scrollTop / Math.max(1, pgEl.offsetHeight); save(); }
  });
  window.addEventListener('pagehide', () => { st.sy = scroller.scrollTop / Math.max(1, pgEl.offsetHeight); save(); });

  // ---------- re-fit when the width changes (rotation, resize) ----------
  let lastW = scroller.clientWidth, rzT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      const w = scroller.clientWidth;
      if (Math.abs(w - lastW) < 2) return;     // ignore mobile URL-bar height changes
      lastW = w;
      show(st.page, { keepFrac: scroller.scrollTop / Math.max(1, pgEl.offsetHeight) });
    }, 250);
  });

  // ---------- offline / install support ----------
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  }

  // ---------- go ----------
  updateUI();
  await show(st.page, { keepFrac: st.sy || 0 });
  lastTop = scroller.scrollTop;
})();
</script>
</body>
</html>
